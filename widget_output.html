<h2 class="sr-only">AI tools tracker: a filterable table of trending MCP servers, plugins, skills, and connectors, with install buttons.</h2>
<div style="display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap;">
  <input id="q" type="text" placeholder="Search name or description" style="flex:1; min-width:180px;" />
  <select id="typeFilter" style="width:130px;">
    <option value="">All types</option>
    <option value="MCP">MCP</option>
    <option value="Plugin">Plugin</option>
    <option value="Skill">Skill</option>
    <option value="Connector">Connector</option>
  </select>
  <select id="apiFilter" style="width:130px;">
    <option value="">API: any</option>
    <option value="No API">No API</option>
    <option value="Needs API">Needs API</option>
  </select>
</div>
<div id="summary" style="font-size:13px; color:var(--text-secondary); margin-bottom:12px;"></div>
<div style="overflow-x:auto;">
<table style="width:100%; border-collapse:collapse; font-size:13px;">
  <thead>
    <tr style="border-bottom:0.5px solid var(--border);">
      <th style="text-align:left; padding:6px 8px; font-weight:500; color:var(--text-secondary);">Name</th>
      <th style="text-align:left; padding:6px 8px; font-weight:500; color:var(--text-secondary); min-width:180px;">Description</th>
      <th style="text-align:left; padding:6px 8px; font-weight:500; color:var(--text-secondary); min-width:180px;">How to use</th>
      <th style="text-align:left; padding:6px 8px; font-weight:500; color:var(--text-secondary);">API</th>
      <th style="text-align:left; padding:6px 8px; font-weight:500; color:var(--text-secondary);">Type</th>
      <th style="text-align:left; padding:6px 8px; font-weight:500; color:var(--text-secondary);">Stars</th>
      <th style="text-align:center; padding:6px 8px; font-weight:500; color:var(--text-secondary);">Link</th>
      <th style="text-align:center; padding:6px 8px; font-weight:500; color:var(--text-secondary);">Install</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
</div>
<script>
const DATA = [{"name":"MindsDB","description":"Unifies queries across 200+ databases and platforms behind a single MCP server, so one agent can ask questions across all of them.","howToUse":"Run via Docker or pip install mindsdb[all], then point any MCP client at it to query connected data sources in natural language.","needsApi":"Needs API","apiNote":"credentials for each connected data source","nature":"MCP","stars":31700,"link":"https://github.com/mindsdb/mindsdb","installCommand":"pip install mindsdb[all]","dateAdded":"2026-07-05","source":"seed","installed":false},{"name":"mcp-github-trending","description":"Fetches GitHub trending repositories and developers, filterable by language and time period (daily/weekly/monthly).","howToUse":"pip install mcp-github-trending, add it as an MCP server, then ask the agent for today's trending repos in a given language.","needsApi":"No API","apiNote":"small but a direct fit for this tracker's own use case","nature":"MCP","stars":49,"link":"https://github.com/hetaoBackend/mcp-github-trending","installCommand":"pip install mcp-github-trending","dateAdded":"2026-07-05","source":"seed","installed":false},{"name":"claude-mem","description":"Captures everything an agent does during a session, compresses it with AI, and injects the relevant context back into future sessions for persistent memory.","howToUse":"Run npx claude-mem install (also works with Codex, Gemini CLI, OpenCode and more), then keep working as normal across sessions.","needsApi":"No API","apiNote":"runs locally as a plugin/worker service; no external key required","nature":"Plugin","stars":85956,"link":"https://github.com/thedotmack/claude-mem","installCommand":"npx claude-mem install","dateAdded":"2026-07-05","source":"github-search","installed":false},{"name":"Ponytail","description":"Agent skill that pushes coding agents toward the smallest possible diff, cutting unnecessary code, dependencies, and over-engineering.","howToUse":"Install as a Claude Code / 16-agent-compatible skill via npm (@dietrichgebert/ponytail) and it nudges every generation toward minimal code.","needsApi":"No API","apiNote":"works without a key; local skill, no external service","nature":"Skill","stars":74631,"link":"https://github.com/DietrichGebert/ponytail","installCommand":"npm install -g @dietrichgebert/ponytail","dateAdded":"2026-07-05","source":"github-search","installed":false},{"name":"codebase-memory-mcp","description":"High-performance code intelligence MCP server that indexes a codebase into a persistent knowledge graph across 158 languages for near-instant structural queries.","howToUse":"One-line install via the install.sh/install.ps1 script, which auto-configures Claude Code, Codex CLI, Gemini CLI and 8 other agents; then say 'Index this project'.","needsApi":"No API","apiNote":"single static binary, fully local, zero dependencies, no API key","nature":"MCP","stars":26618,"link":"https://github.com/DeusData/codebase-memory-mcp","installCommand":"curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh | bash","dateAdded":"2026-07-05","source":"github-search","installed":false},{"name":"FastMCP","description":"The fast, Pythonic framework for building MCP servers and clients, handling the protocol boilerplate so devs write plain Python functions as tools.","howToUse":"Install with uv/pip, decorate Python functions with @mcp.tool(), and run the server to expose it to any MCP client.","needsApi":"No API","apiNote":"no key needed for the framework itself; tools you build may need their own credentials","nature":"MCP","stars":25980,"link":"https://github.com/PrefectHQ/fastmcp","installCommand":"uv pip install fastmcp","dateAdded":"2026-07-05","source":"github-search","installed":false},{"name":"mcp-use","description":"Fullstack MCP framework for building MCP servers and MCP Apps that work with ChatGPT, Claude, and other AI agent clients.","howToUse":"Scaffold a new app with the create-mcp-use-app CLI, or pip install mcp-use to build/connect servers from Python.","needsApi":"No API","apiNote":"framework itself is free/local; deploy/login commands talk to mcp-use's own cloud service optionally","nature":"MCP","stars":10248,"link":"https://github.com/mcp-use/mcp-use","installCommand":"npx create-mcp-use-app@latest","dateAdded":"2026-07-05","source":"github-search","installed":false},{"name":"mcp-agent","description":"Framework for building effective AI agents using simple, composable workflow patterns on top of the Model Context Protocol.","howToUse":"Scaffold a project with the uvx mcp-agent CLI (init/deploy) or pip install mcp-agent to build agents directly in Python.","needsApi":"Needs API","apiNote":"requires an LLM provider key (e.g. Anthropic/OpenAI) for the agent to actually call a model","nature":"MCP","stars":8402,"link":"https://github.com/lastmile-ai/mcp-agent","installCommand":"uvx mcp-agent init","dateAdded":"2026-07-05","source":"github-search","installed":false},{"name":"Playwright Skill","description":"Claude Code skill/plugin that lets Claude autonomously write and execute custom Playwright browser automation for testing and validation.","howToUse":"Add the marketplace and install the plugin in Claude Code, then just ask Claude to test or automate something in the browser.","needsApi":"No API","apiNote":"runs Playwright locally, no external API key","nature":"Skill","stars":2869,"link":"https://github.com/lackeyjb/playwright-skill","installCommand":"/plugin marketplace add lackeyjb/playwright-skill && /plugin install playwright-skill@playwright-skill","dateAdded":"2026-07-05","source":"github-search","installed":false},{"name":"pg-aiguide","description":"MCP server and Claude plugin that gives coding agents Postgres-specific skills and documentation so they generate better PostgreSQL code.","howToUse":"Add it as a skill (npx skills add timescale/pg-aiguide) or as a Claude Code plugin via marketplace, then ask for help with Postgres queries/schemas.","needsApi":"Needs API","apiNote":"MCP server needs a Postgres connection string to introspect a real database","nature":"MCP","stars":1780,"link":"https://github.com/timescale/pg-aiguide","installCommand":"claude plugin marketplace add timescale/pg-aiguide && claude plugin install pg@aiguide","dateAdded":"2026-07-05","source":"github-search","installed":false},{"name":"Token Optimizer","description":"Claude Code plugin that cuts wasted context tokens, checkpoints work so it survives compaction, and shows a live dashboard of tokens/cost per session.","howToUse":"Install via the Claude Code plugin marketplace, then run /token-optimizer once to set up hooks; it runs automatically afterward.","needsApi":"No API","apiNote":"zero dependencies, zero telemetry, works fully locally","nature":"Plugin","stars":1548,"link":"https://github.com/alexgreensh/token-optimizer","installCommand":"/plugin marketplace add alexgreensh/token-optimizer && /plugin install token-optimizer@alexgreensh-token-optimizer","dateAdded":"2026-07-05","source":"github-search","installed":false},{"name":"Frontend Slides","description":"Claude Code skill/plugin that turns plain descriptions or PowerPoint files into polished HTML presentations without needing CSS or JS knowledge.","howToUse":"Add the marketplace and install with /plugin marketplace add https://github.com/zarazhangrui/frontend-slides then /plugin install frontend-slides@frontend-slides, or clone into ~/.claude/skills/.","needsApi":"No API","apiNote":"runs locally, no external API key needed","nature":"Skill","stars":24654,"link":"https://github.com/zarazhangrui/frontend-slides","installCommand":"/plugin marketplace add https://github.com/zarazhangrui/frontend-slides && /plugin install frontend-slides@frontend-slides","dateAdded":"2026-07-06","source":"github-search","installed":false},{"name":"claude-obsidian","description":"Self-organizing Claude Code plugin that turns an Obsidian vault into a persistent, compounding 'second brain' wiki.","howToUse":"Run claude plugin marketplace add AgriciDaniel/claude-obsidian then claude plugin install claude-obsidian@agricidaniel-claude-obsidian.","needsApi":"No API","apiNote":"works against a local Obsidian vault path, no external API key required","nature":"Plugin","stars":8821,"link":"https://github.com/AgriciDaniel/claude-obsidian","installCommand":"claude plugin marketplace add AgriciDaniel/claude-obsidian && claude plugin install claude-obsidian@agricidaniel-claude-obsidian","dateAdded":"2026-07-06","source":"github-search","installed":false},{"name":"Harness","description":"Meta-skill that designs and generates domain-specific multi-agent team architectures for Claude Code.","howToUse":"Run /plugin marketplace add revfactory/harness then /plugin install harness@harness-marketplace inside Claude Code.","needsApi":"No API","apiNote":"no external API key needed","nature":"Plugin","stars":8213,"link":"https://github.com/revfactory/harness","installCommand":"/plugin marketplace add revfactory/harness && /plugin install harness@harness-marketplace","dateAdded":"2026-07-06","source":"github-search","installed":false},{"name":"Claude Octopus","description":"Claude Code plugin that runs a task across up to nine AI models (Codex, Gemini, Copilot, Qwen, etc.) and flags disagreements before you ship.","howToUse":"Run claude plugin marketplace add https://github.com/nyldn/plugins.git then claude plugin install octo@nyldn-plugins.","needsApi":"Needs API","apiNote":"requires API keys or CLI logins for whichever other providers you want to orchestrate (Codex, Gemini, etc.)","nature":"Plugin","stars":3750,"link":"https://github.com/nyldn/claude-octopus","installCommand":"claude plugin marketplace add https://github.com/nyldn/plugins.git && claude plugin install octo@nyldn-plugins","dateAdded":"2026-07-06","source":"github-search","installed":false},{"name":"Ars Contexta","description":"Claude Code plugin that generates a tailored personal knowledge-management system (folders, hooks, templates) from a short conversation about how you work.","howToUse":"Run /plugin marketplace add agenticnotetaking/arscontexta then /plugin install arscontexta@agenticnotetaking, then /arscontexta:setup.","needsApi":"No API","apiNote":"no external API key needed, one-time setup is token-intensive but local","nature":"Plugin","stars":3434,"link":"https://github.com/agenticnotetaking/arscontexta","installCommand":"/plugin marketplace add agenticnotetaking/arscontexta && /plugin install arscontexta@agenticnotetaking","dateAdded":"2026-07-06","source":"github-search","installed":false},{"name":"Council of High Intelligence","description":"Claude Code plugin where 18 AI personas across multiple LLM providers deliberate on a hard decision in one command.","howToUse":"Run /plugin marketplace add 0xNyk/council-of-high-intelligence then /plugin install council@council-of-high-intelligence.","needsApi":"Needs API","apiNote":"needs API keys for whichever other LLM providers are included in the deliberation","nature":"Plugin","stars":3332,"link":"https://github.com/0xNyk/council-of-high-intelligence","installCommand":"/plugin marketplace add 0xNyk/council-of-high-intelligence && /plugin install council@council-of-high-intelligence","dateAdded":"2026-07-06","source":"github-search","installed":false},{"name":"NotFair","description":"Claude Code plugin/CLI that connects to Google Search Console, Google Ads, and Meta Ads to diagnose and fix SEO and ad-spend problems.","howToUse":"Run /plugin marketplace add nowork-studio/notfair then /plugin install notfair@nowork-studio, then connect your Google/Meta ad accounts.","needsApi":"Needs API","apiNote":"requires OAuth credentials for Google Search Console, Google Ads, and Meta Ads accounts","nature":"Plugin","stars":3058,"link":"https://github.com/nowork-studio/NotFair","installCommand":"/plugin marketplace add nowork-studio/notfair && /plugin install notfair@nowork-studio","dateAdded":"2026-07-06","source":"github-search","installed":false},{"name":"obsidian-second-brain","description":"Cross-CLI skill (Claude Code, Codex, Gemini, OpenCode, and more) that turns an Obsidian vault into a shared AI-first second brain with 44 commands.","howToUse":"Clone into ~/.claude/skills/obsidian-second-brain (or the equivalent skills folder for your CLI).","needsApi":"No API","apiNote":"runs against a local Obsidian vault, no external API key needed","nature":"Skill","stars":2977,"link":"https://github.com/eugeniughelbur/obsidian-second-brain","installCommand":"git clone https://github.com/eugeniughelbur/obsidian-second-brain ~/.claude/skills/obsidian-second-brain","dateAdded":"2026-07-06","source":"github-search","installed":false},{"name":"Archify","description":"Agent skill that turns a plain-English system description into a polished architecture, sequence, or workflow diagram as a single exportable HTML file.","howToUse":"Clone into your agent's skills folder (e.g. ~/.claude/skills/archify) and run npm install once for the diagram renderers.","needsApi":"No API","apiNote":"runs entirely locally; one-time npm install for the ajv schema validator","nature":"Skill","stars":2737,"link":"https://github.com/tt-a1i/archify","installCommand":"git clone https://github.com/tt-a1i/archify.git ~/.claude/skills/archify && cd ~/.claude/skills/archify && npm install","dateAdded":"2026-07-06","source":"github-search","installed":false},{"name":"Pro Workflow","description":"Claude Code plugin giving self-correcting, persistent memory via an FTS5-indexed wiki that compounds across sessions.","howToUse":"Run /plugin marketplace add rohitg00/pro-workflow then /plugin install pro-workflow@pro-workflow (or npx skillkit install rohitg00/pro-workflow).","needsApi":"No API","apiNote":"local SQLite-backed storage, no external API needed","nature":"Plugin","stars":2595,"link":"https://github.com/rohitg00/pro-workflow","installCommand":"/plugin marketplace add rohitg00/pro-workflow && /plugin install pro-workflow@pro-workflow","dateAdded":"2026-07-06","source":"github-search","installed":false}];
const TODAY = "2026-07-06";
const INSTALLED_COUNT = 2;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtStars(n) {
  return Number(n).toLocaleString();
}

function apiColor(v) {
  return v === 'No API' ? 'var(--text-success)' : 'var(--text-warning)';
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const type = document.getElementById('typeFilter').value;
  const api = document.getElementById('apiFilter').value;

  const filtered = DATA.filter(d => {
    if (type && d.nature !== type) return false;
    if (api && d.needsApi !== api) return false;
    if (q && !(d.name.toLowerCase().includes(q) || d.description.toLowerCase().includes(q))) return false;
    return true;
  });

  const groups = new Map();
  for (const d of filtered) {
    const key = d.dateAdded + '|' + (d.source || '');
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(d);
  }
  const keys = Array.from(groups.keys()).sort().reverse();

  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = '';

  for (const key of keys) {
    const [dateAdded, source] = key.split('|');
    const groupRow = document.createElement('tr');
    groupRow.innerHTML = '<td colspan="8" style="padding:10px 8px 4px; font-size:12px; color:var(--text-muted);">Added ' + esc(dateAdded) + (source ? ' (' + esc(source) + ')' : '') + '</td>';
    rowsEl.appendChild(groupRow);

    for (const d of groups.get(key)) {
      const tr = document.createElement('tr');
      tr.style.borderBottom = '0.5px solid var(--border)';
      tr.innerHTML =
        '<td style="padding:8px; font-weight:500; vertical-align:top;">' + esc(d.name) + '</td>' +
        '<td style="padding:8px; color:var(--text-secondary); vertical-align:top;">' + esc(d.description) + '</td>' +
        '<td style="padding:8px; color:var(--text-secondary); vertical-align:top;">' + esc(d.howToUse) + '</td>' +
        '<td style="padding:8px; vertical-align:top;"><span style="color:' + apiColor(d.needsApi) + '; font-weight:500;">' + esc(d.needsApi) + '</span><br/><span style="font-size:11px; color:var(--text-muted);">' + esc(d.apiNote || '') + '</span></td>' +
        '<td style="padding:8px; vertical-align:top;">' + esc(d.nature) + '</td>' +
        '<td style="padding:8px; vertical-align:top;">' + fmtStars(d.stars) + ' <i class="ti ti-star" style="font-size:12px;" aria-hidden="true"></i></td>';

      const linkTd = document.createElement('td');
      linkTd.style.padding = '8px';
      linkTd.style.textAlign = 'center';
      linkTd.style.verticalAlign = 'top';
      const linkBtn = document.createElement('button');
      linkBtn.setAttribute('aria-label', 'Open link');
      linkBtn.style.padding = '4px 8px';
      linkBtn.innerHTML = '<i class="ti ti-external-link" style="font-size:16px;" aria-hidden="true"></i>';
      linkBtn.addEventListener('click', () => openLink(d.link));
      linkTd.appendChild(linkBtn);
      tr.appendChild(linkTd);

      const installTd = document.createElement('td');
      installTd.style.padding = '8px';
      installTd.style.textAlign = 'center';
      installTd.style.verticalAlign = 'top';
      const installBtn = document.createElement('button');
      installBtn.innerHTML = '<i class="ti ti-download" style="font-size:14px; margin-right:4px;" aria-hidden="true"></i>Install ↗';
      installBtn.addEventListener('click', () => sendPrompt('Install ' + d.name + ' for me: ' + (d.installCommand || d.link)));
      installTd.appendChild(installBtn);
      tr.appendChild(installTd);

      rowsEl.appendChild(tr);
    }
  }

  document.getElementById('summary').textContent = filtered.length + ' of ' + DATA.length + ' not yet installed \u00b7 ' + INSTALLED_COUNT + ' installed (hidden) \u00b7 last run ' + TODAY;
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('typeFilter').addEventListener('change', render);
document.getElementById('apiFilter').addEventListener('change', render);
render();
</script>
